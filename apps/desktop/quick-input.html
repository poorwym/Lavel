<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lavel - 快速输入</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        -webkit-app-region: drag;
      }
      
      #root {
        width: 100vw;
        height: 100vh;
        -webkit-app-region: no-drag;
      }
      
      /* 防止选中文本 */
      * {
        -webkit-user-select: none;
        user-select: none;
      }
      
      /* 输入框可以选中文本 */
      input, textarea {
        -webkit-user-select: text;
        user-select: text;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/quick-input.tsx"></script>
  </body>
</html>
